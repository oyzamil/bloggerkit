<!doctype html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Labels & categories · blogr demo</title>
	<script src="assets/head.js"></script>
	<link rel="stylesheet" href="assets/style.css" />
</head>

<body>
	<header class="site-header">
		<div id="site-header"></div>
	</header>

	<div class="layout">
		<aside class="sidebar">
			<nav id="site-sidebar"></nav>
		</aside>

		<main class="content">
			<div class="page-head">
				<span class="eyebrow">Content</span>
				<h1>Labels &amp; categories</h1>
				<p>Blogger uses "labels" and "categories" interchangeably — <code>categories()</code> is a plain alias
					of <code>labels()</code>.</p>
			</div>

			<div class="card">
				<div class="card__head">
					<h3>blog.labels()</h3>
					<span class="endpoint">GET ./posts/summary?max-results=0</span>
				</div>
				<div class="card__body">
					<div class="status-line is-loading" id="labels-status"><span class="dot"></span>fetching…</div>
					<div class="chips" id="labels-chips"></div>
				</div>
			</div>

			<div class="card">
				<div class="card__head">
					<h3>blog.label(label, options)</h3>
					<span class="endpoint">GET ./posts/default/-/{label}</span>
				</div>
				<div class="card__body">
					<div class="controls">
						<div class="field">
							<label for="label-input">label</label>
							<input type="text" id="label-input" placeholder="click a chip above" />
						</div>
						<div class="field">
							<label for="label-limit">limit</label>
							<input type="number" id="label-limit" value="6" min="0" max="50" />
						</div>
						<div class="field">
							<label for="label-orderby">orderBy</label>
							<select id="label-orderby">
								<option value="">(default)</option>
								<option value="published">published</option>
								<option value="updated">updated</option>
							</select>
						</div>
					</div>
					<div class="actions-row">
						<button class="btn btn-primary btn-sm" id="label-run">Run blog.label()</button>
					</div>
					<div class="status-line" id="label-status"></div>
					<div id="label-result"></div>
					<div class="pager-controls" id="label-pager"></div>
				</div>
			</div>

			<div class="card">
				<div class="card__head">
					<h3>blog.categories()</h3>
					<span class="endpoint">alias of labels()</span>
				</div>
				<div class="card__body">
					<button class="btn btn-ghost btn-sm" id="categories-run">Run blog.categories()</button>
					<div id="categories-result" class="mt-3"></div>
				</div>
			</div>
		</main>
	</div>

	<footer class="site-footer">
		<div id="site-footer"></div>
	</footer>

	<script src="https://unpkg.com/blogr-plugins/dist/blogr-plugins.min.js"></script>
	<script src="../dist/blogr.min.js"></script>
	<script src="assets/common.js"></script>
	<script src="assets/labels.page.js"></script>
</body>

</html>
