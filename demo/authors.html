<!doctype html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Authors · blogr demo</title>
	<script src="assets/head.js"></script>
	<link rel="stylesheet" href="assets/style.css" />
	<style>
		.author-grid {
			display: grid;
			grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
			gap: 0.75rem;
			margin-top: 0.75rem;
		}

		.author-card {
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 0.5rem;
			padding: 0.75rem;
			border-radius: var(--radius, 0.5rem);
			border: 1px solid var(--border-color, #e5e7eb);
			text-align: center;
			text-decoration: none;
			color: inherit;
		}

		.author-card__avatar {
			width: 48px;
			height: 48px;
			border-radius: 50%;
			object-fit: cover;
			background: var(--muted, #f1f5f9);
		}

		.author-card__name {
			font-size: 0.875rem;
			font-weight: 500;
		}
	</style>
</head>

<body>
	<header class="site-header">
		<div id="site-header"></div>
	</header>

	<div class="layout">
		<aside class="sidebar">
			<nav id="site-sidebar"></nav>
		</aside>

		<main class="content">
			<div class="page-head">
				<span class="eyebrow">Content</span>
				<h1>Authors</h1>
				<p>Blogger's feed API has no dedicated authors endpoint — <code>blog.authors()</code> aggregates unique
					authors seen across a sample of the most recent posts.</p>
			</div>

			<div class="card">
				<div class="card__head">
					<h3>blog.authors(options)</h3>
					<span class="endpoint">GET ./posts/summary?max-results={sampleSize}</span>
				</div>
				<div class="card__body">
					<div class="controls">
						<div class="field">
							<label for="authors-sample-size">sampleSize</label>
							<input type="number" id="authors-sample-size" value="150" min="1" max="1000" />
						</div>
					</div>
					<div class="actions-row">
						<button class="btn btn-primary btn-sm" id="authors-run">Run blog.authors()</button>
					</div>
					<div class="status-line is-loading" id="authors-status"><span class="dot"></span>fetching…</div>
					<div class="author-grid" id="authors-result"></div>
				</div>
			</div>
		</main>
	</div>

	<footer class="site-footer">
		<div id="site-footer"></div>
	</footer>

	<script src="https://unpkg.com/blogr-plugins/dist/blogr-plugins.min.js"></script>
	<script src="../dist/blogr.min.js"></script>
	<script src="assets/common.js"></script>
	<script src="assets/authors.page.js"></script>
</body>

</html>
